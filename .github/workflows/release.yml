name: Publish v0.6.0

on:
  push:
    branches: [main]
    paths: [ad-skipper-0.6.0.zip]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.0 ad-skipper-0.6.0.zip \
            --title "v0.6.0" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
