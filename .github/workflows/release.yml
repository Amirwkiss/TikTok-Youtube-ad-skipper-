name: Publish v0.7.1-test

on:
  push:
    branches: [main]
    paths: [ad-skipper-0.7.1-test.zip]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.1-test >/dev/null 2>&1; then
            gh release edit v0.7.1-test --notes-file RELEASE_NOTES.md --prerelease
            gh release upload v0.7.1-test ad-skipper-0.7.1-test.zip --clobber
          else
            gh release create v0.7.1-test ad-skipper-0.7.1-test.zip \
              --title "v0.7.1-test — экспериментальные аудиоотпечатки" \
              --notes-file RELEASE_NOTES.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
